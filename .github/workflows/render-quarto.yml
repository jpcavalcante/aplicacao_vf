name: Render Quarto → GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout do código
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Instalar Quarto (sem R — engine: markdown não precisa de knitr/rmarkdown)
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # 3. Renderizar o documento Quarto
      - name: Render Quarto
        run: quarto render index.qmd

      # 4. Publicar docs/ no GitHub Pages (só na branch main)
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
